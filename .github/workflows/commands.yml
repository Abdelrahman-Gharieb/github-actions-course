on:
  workflow_dispatch:

jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - name: Set API Key
        run: echo "API_KEY=12345" >> $GITHUB_ENV
      - name: Masking The API Key and Displaying It
        run: |
          echo "::add-mask::$API_KEY"
          echo "Using API KEY -> $API_KEY"